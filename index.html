<!-- impeccable-direction spielmodus-spielbericht-b5fa38d0-v2
THESIS: Spielmodus liest sich als der digitale Spielbericht am Kampfrichtertisch,
nicht als Formular-Attrappe und nicht als eingefärbtes Dashboard; verweigert
sowohl das alte Card-Grid als auch die Vorgänger-Kreidetafel, die nur Farbe/
Textur tauschte statt die Struktur neu zu denken.
OWN-WORLD: neutrales Blatt — Papierweiß (hell) / Tiefanthrazit (dunkel), keine
Kreide-Grün- und keine Creme-Pergament-Töne. Scharfe Lineatur statt
Kachel-Schatten, Ankreuz-Kästchen statt Stempel, Zeilennummern statt Icons als
Ordnungsprinzip. Ergebnisfarben bleiben App-weit (Grün/Rot/Gelb/Blau).
STORY: Trainer trägt Ereignisse wie am Kampfrichtertisch ein; jede Aktion wird
nummeriert protokolliert statt „gemalt" — Tempo und Nüchternheit vor Deko.
FIRST VIEWPORT: Formularkopf mit Spielauswahl; Ergebnis/Zeit als lineierte
Formularfelder; zwei Reihen Ankreuz-Zellen für Ergebnisse; darunter ein
nummeriertes, gezeiltes Ereignisprotokoll mit Zebra-Zeilen.
FORM: vom Nutzer im Dialog aus präsentierten Alternativen gewählt (nicht neu
zugelost) — die zuvor per MY PICK gebaute Kreidetafel-Welt wurde nach
Nutzerfeedback verworfen; die ursprünglich zugeloste, damals abgelehnte
Richtung „Kampfrichtertisch-Protokoll" (seed b5fa38d0, Index 3) wird jetzt
gebaut. code-led.
FINISH: unreviewed and undocumented is unfinished; this build ends with the
finish review, the verdict, and DESIGN.md
-->

<!-- Modal -->
<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal-box" id="modal-box">
    <div class="modal-head">
      <h3 class="modal-title" id="modal-title"></h3>
      <button class="modal-close-btn" id="modal-close">&times;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<!-- Rückfrage vor löschenden Aktionen. Bewusst NICHT das native confirm():
     das schaltet der Browser nach mehreren Dialogen stillschweigend ab
     (und in der installierten App ebenso), wodurch Löschen wortlos nichts tat. -->
<div class="modal-backdrop confirm-backdrop" id="confirm-backdrop">
  <div class="modal-box confirm-box">
    <div class="modal-body">
      <p class="confirm-text" id="confirm-text"></p>
      <div class="form-actions">
        <button class="btn btn-outline" id="confirm-cancel" type="button">Abbrechen</button>
        <button class="btn btn-danger" id="confirm-ok" type="button">Löschen</button>
      </div>
    </div>
  </div>
</div>

<!-- Toasts -->
<div class="toast-area" id="toast-area"></div>

<script>
  // Service Worker registrieren — macht die App offline lauffähig und installierbar.
  // Läuft nur über http(s); beim Öffnen per file:// wird es still übersprungen.
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js')
        .catch(err => console.warn('Service Worker nicht registriert:', err));
    });
  }
</script>
</body>
